---
# LTX-Video 2.3 Concept Slider Training Example
#
# Concept sliders teach the model a bipolar concept axis (e.g. day ↔ night)
# using contrastive prompt pairs — no training videos required.
#
# You can train with:
#   - Text prompt pairs only (default): the dummy dataset below provides noise
#     carriers for the training loop; image content is ignored.
#   - Image pairs + text (optional): supply real before/after images via the
#     slider.datasets field for image-supervised training (see bottom of file).
#
# Multiple concept axes can be trained jointly using the targets list.
# Optional anchors constrain the LoRA to prevent unrelated concept drift.
#
# Hardware target: RTX 3090 24GB with quantization + layer offloading.
# The text encoder (Gemma) is frozen and offloaded after prompt caching.
#
# Usage:
#   python run.py config/examples/train_slider_ltx23.example.yml
#
# The resulting LoRA can be applied at inference time with a multiplier:
#   positive multiplier (e.g. +3.0) → enhances the positive concept (daytime)
#   negative multiplier (e.g. -3.0) → enhances the negative concept (nighttime)

job: extension
config:
  name: "day_night_slider_ltx23_v1"
  process:
    - type: "concept_slider"

      # root folder to save training sessions/samples/weights
      training_folder: "output"
      device: cuda:0

      network:
        type: "lora"
        # rank 16 is a good starting point for concept sliders on 24GB.
        # Higher rank (32-64) gives more capacity but uses more VRAM.
        linear: 16
        linear_alpha: 16  # note: overridden to equal rank for transformer models (peft_format)

        # --- Layer targeting ---
        # By default ALL linear layers inside transformer_blocks are trained:
        # video self-attn (attn1), video cross-attn (attn2), video FF (ff),
        # audio self-attn (audio_attn1), audio cross-attn (audio_attn2), audio FF (audio_ff),
        # and cross-modal (audio_to_video_attn, video_to_audio_attn).
        #
        # For a visual concept slider you almost certainly want to exclude audio layers.
        # Use network_kwargs to filter by substring of the full module path:
        #
        # Video-only (recommended for visual concept sliders):
        network_kwargs:
          ignore_if_contains: ["audio_"]
        #
        # Other useful combinations (uncomment one block at a time):
        #
        # Attention-only, no feed-forward (video + audio):
        # network_kwargs:
        #   ignore_if_contains: ["ff.net"]
        #
        # Only cross-modal audio↔video layers:
        # network_kwargs:
        #   only_if_contains: ["audio_to_video_attn", "video_to_audio_attn"]
        #
        # Everything (no filter) — default if network_kwargs is omitted:
        # network_kwargs: {}

      save:
        dtype: float16
        save_every: 100
        max_step_saves_to_keep: 4

      # The dataset images are NOT used for slider concept learning —
      # only their encoded latents serve as noise carriers for the training loop.
      # Any image folder works; a blank placeholder is provided for convenience.
      # If you supply image pairs under slider.datasets below, you can keep this
      # entry as-is — it drives the CFG slider loss while slider.datasets drives
      # the image pair loss independently.
      datasets:
        - folder_path: "config/examples/slider_dummy_dataset"
          caption_ext: "txt"
          num_frames: 1      # keep at 1 (image mode) — avoids i2v/audio complexity
          do_i2v: false      # explicitly disable image-to-video conditioning
          resolution: 512

      train:
        batch_size: 1
        steps: 500           # 300–1000 is typical; start low and evaluate
        gradient_accumulation: 1
        train_unet: true     # trains the video transformer (named 'unet' for compat)
        train_text_encoder: false  # Gemma must stay frozen
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "linear"
        optimizer: "adamw8bit"
        lr: 1e-4
        optimizer_params:
          weight_decay: 1e-4
        dtype: bf16

        # Offload Gemma after prompt embeddings are cached at startup.
        # Required for 24GB — Gemma alone is ~12GB.
        unload_text_encoder: true

      model:
        # Set this to your local LTX-Video-2.3 checkpoint path.
        # This should be a directory containing the model safetensors
        # (e.g. downloaded from Lightricks/LTX-Video-2.3 on HuggingFace).
        name_or_path: "/path/to/LTX-Video-2.3"
        arch: "ltx2"
        quantize: true       # quantize transformer to int8 for 24GB
        quantize_te: true    # quantize text encoder during its brief use at startup
        low_vram: true       # enable layer offloading to system RAM

      sample:
        sampler: "flowmatch"
        sample_every: 100
        width: 512
        height: 512
        # num_frames must satisfy: (num_frames - 1) % 8 == 0
        # Valid values: 1, 9, 17, 25, 33, 41, 49 ...
        # Use 1 for fast image samples during training, 25 for short video clips.
        num_frames: 25
        fps: 24
        # Use --m <value> to control the slider multiplier at sample time.
        # Positive values push toward the positive concept, negative toward negative.
        prompts:
          - "a mountain landscape at midday --m -4"
          - "a mountain landscape at midday --m -2"
          - "a mountain landscape at midday --m 2"
          - "a mountain landscape at midday --m 4"
          - "a city street --m -4"
          - "a city street --m -2"
          - "a city street --m 2"
          - "a city street --m 4"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4.0
        sample_steps: 30
        network_multiplier: 1.0

      logging:
        log_every: 10
        use_wandb: false
        verbose: false

      slider:
        # guidance_strength controls how strongly the contrastive offset is applied.
        # 3.0 is a sensible default; increase for a stronger effect, decrease if
        # the slider becomes too aggressive or unstable.
        guidance_strength: 3.0

        # anchor_strength weights the anchor loss (if anchors are set).
        # Anchors prevent unrelated concepts from drifting during training.
        anchor_strength: 1.0

        # ------------------------------------------------------------------
        # Concept axes — what the slider learns
        #
        # targets: list of concept pairs to train jointly.
        # Each entry defines one positive/negative pole and an optional weight
        # to balance its contribution relative to the other targets.
        #
        # target_class: neutral context the slider operates within.
        # Leave blank for a fully generic slider, or set to a subject
        # (e.g. "a landscape") to bias the slider toward that domain.
        # ------------------------------------------------------------------
        targets:
          - target_class: ""
            positive: "daytime scene, bright sunlight, blue sky, day"
            negative: "nighttime scene, dark sky, stars, moonlight, night, low light"
            weight: 1.0

          # Add more axes here if needed, e.g.:
          # - target_class: "a city"
          #   positive: "busy, crowded, rush hour"
          #   negative: "empty, quiet, deserted"
          #   weight: 0.5

        # ------------------------------------------------------------------
        # Anchors (optional)
        # Prompts that should be held stable — the LoRA is penalised for
        # changing its output on these. Useful to prevent concept bleed.
        # ------------------------------------------------------------------
        # anchors:
        #   - prompt: "a photo"
        #     multiplier: 1.0

        # ------------------------------------------------------------------
        # Legacy single-pair syntax (still works — no config changes needed):
        # ------------------------------------------------------------------
        # positive_prompt: "daytime scene, bright sunlight, blue sky, day"
        # negative_prompt: "nighttime scene, dark sky, stars, moonlight, night, low light"
        # target_class: ""
        # anchor_class: "a photo"

        # ------------------------------------------------------------------
        # Image pair datasets (optional)
        # Supply real before/after image pairs for image-supervised training.
        # Combinable with the text targets above — both losses run each step.
        # ------------------------------------------------------------------
        # datasets:
        #   # Side-by-side pairs: left half = negative image, right half = positive
        #   - pair_folder: "/path/to/side-by-side-pairs"
        #     network_weight: 2.0
        #     target_class: ""    # fallback caption if no .txt file alongside image
        #     size: 512
        #
        #   # Or separate positive/negative folders (filenames must match):
        #   # - pos_folder: "/path/to/positive-images"
        #   #   neg_folder: "/path/to/negative-images"
        #   #   network_weight: 2.0
        #   #   target_class: ""
        #   #   size: 512

        # img_loss_weight: 1.0   # scale applied to the image pair MSE loss
        # cfg_loss_weight: 1.0   # scale applied to the CFG slider loss

meta:
  name: "day_night_slider_ltx23"
  version: "1.0"
